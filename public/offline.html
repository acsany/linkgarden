<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6855d9" />
    <title>Reconnect · Linkgarden</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f7f8fa;
        color: #242331;
        font:
          16px/1.6 system-ui,
          sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }
      p {
        color: #646273;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        margin-top: 12px;
        background: #6855d9;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Reconnect to manage your pages or open a link. Private notes and analytics are only
        available online.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
