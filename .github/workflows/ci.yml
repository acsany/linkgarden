name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: linkgarden
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: linkgarden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkgarden -d linkgarden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Scan tracked source for credentials and machine paths
        run: python3 scripts/check-source.py
      - name: Scan Git history for secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all .
      - name: Audit known high-severity dependency advisories
        run: npm audit --audit-level=high
      - run: npm run check
      - name: Embedded PostgreSQL integration and MCP tests
        run: npm test
      - name: Managed PostgreSQL driver integration and MCP tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://linkgarden:ci-only-password@localhost:5432/linkgarden_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:pwa
