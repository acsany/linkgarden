name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: linkgarden
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: linkgarden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkgarden -d linkgarden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Embedded PostgreSQL integration and MCP tests
        run: npm test
      - name: Managed PostgreSQL driver integration and MCP tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://linkgarden:ci-only-password@localhost:5432/linkgarden_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:pwa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
